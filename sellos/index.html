<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tarjeta de sellos de Azul Caribe Lounge: junta sellos en cada visita y gana descuentos, café y cócteles.">
<meta name="theme-color" content="#0b1d33">
<title>Tarjeta de sellos — Azul Caribe Lounge</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
/* Tarjeta de sellos: misma marca de la carta (azul noche, azul caribe, dorado del logo). */
:root{--bg:#f3f7fb;--card:#0b1d33;--ink:#0b1d33;--muted:#5b6b80;--line:#e3e9f1;--caribe:#0a6fa8;--caribe-dark:#085a88;--gold:#e0b43c;--gold-soft:rgba(224,180,60,.16);--white:#fff;--danger:#c2412d;
--display:'DM Serif Display',Georgia,serif;--text:'Fira Sans','Segoe UI',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand img{width:38px;height:38px;border-radius:10px;background:var(--card);padding:6px}
.brand b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;padding:7px 12px;font:600 13px var(--text);color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.card{background:radial-gradient(120% 90% at 50% 0%,#17365c,var(--card) 62%);color:#fff;border-radius:24px;padding:24px 20px 22px;box-shadow:0 18px 40px rgba(11,29,51,.22)}
.card h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;text-wrap:balance}
.card .sub{color:#c6d1de;font-size:15px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 10px;margin:22px 0 6px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.dot{width:100%;max-width:56px;aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;font:600 14px var(--text);color:rgba(255,255,255,.45);position:relative}
.dot.milestone{border-color:var(--gold);color:var(--gold)}
.dot.on{border:0;background:var(--gold);color:var(--card)}
.dot.on svg{width:58%;height:58%}
.dot.ready{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 18px 4px rgba(224,179,65,.75);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 6px 1px rgba(224,179,65,.4)}}
.dot.prize{box-shadow:0 0 0 3px #fff}
.dot.on img{width:62%;filter:brightness(0) saturate(100%) invert(9%) sepia(29%) saturate(2700%) hue-rotate(190deg)}
.dot.new{animation:stamp .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{0%{transform:scale(1.9) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:none}}
.lab{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.02em;text-align:center;min-height:15px}
.progress{margin-top:12px;font-size:15px;color:#e6edf5}
.progress b{color:var(--gold)}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;height:52px;border:0;border-radius:999px;font:600 16px var(--text);cursor:pointer;transition:transform .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn-gold{background:var(--gold);color:var(--card);margin-top:18px}
.btn-gold:disabled{opacity:.45;cursor:default}
.btn-blue{background:var(--caribe);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{font-size:13px;color:#c6d1de;margin-top:10px;text-align:center;min-height:20px}
.win{background:#fff;border:2px solid var(--gold);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.win h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15}
.win p{color:var(--muted);font-size:15px}
section.box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}
section.box h2{font-family:var(--display);font-weight:400;font-size:21px;margin-bottom:10px}
.rew{list-style:none;display:flex;flex-direction:column;gap:10px}
.rew li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.rew .n{width:44px;height:44px;border-radius:50%;background:var(--gold-soft);color:var(--ink);display:grid;place-items:center;font:700 15px var(--text)}
.rew .t{min-width:0}.rew .t b{display:block;font-weight:600}.rew .t span{font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.ready{background:var(--gold);color:var(--card)}.tag.used{background:#e8f3ea;color:#2e6b3c}
.rules{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding-left:18px}
.legal{font-size:12px;color:var(--muted);text-align:center}
.foot{display:flex;justify-content:center}
.foot a{color:var(--caribe);font-weight:600;text-decoration:none}
dialog{border:0;border-radius:24px;padding:24px 20px;width:min(92vw,400px);margin:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(11,29,51,.55)}
dialog h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15}
dialog p{color:var(--muted);font-size:15px;margin:6px 0 16px}
.err{color:var(--danger);font-size:14px;text-align:center;min-height:21px;margin-bottom:6px}
.row{display:flex;flex-direction:column;gap:10px}
:focus-visible{outline:3px solid var(--caribe);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.dot.new{animation:none}}

.status{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--muted)}
.hello{color:var(--gold);font-weight:600;font-size:14px;margin-bottom:2px}
.form{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:#e6edf5}
.form input:not([type=checkbox]){height:50px;border:2px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font:500 17px var(--text);padding:0 14px}
.form input::placeholder{color:rgba(255,255,255,.4)}
.form input:focus{outline:none;border-color:var(--gold)}
.form .check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:13px;color:#c6d1de;line-height:1.45}
.form .check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--gold)}
.form .btn-gold{margin-top:4px}
.join .err{color:#ffb4a6;text-align:left;margin:0;min-height:0}
.link{background:none;border:0;color:var(--gold);font:600 14px var(--text);margin-top:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.link.dim{color:var(--muted);margin-top:0}
.status .link{color:var(--caribe);margin:0 0 0 6px}
.pinbox{display:block;width:100%;height:64px;border:2px solid var(--line);border-radius:14px;text-align:center;font:700 28px var(--text);letter-spacing:.4em;color:var(--ink);background:#fff;margin-bottom:10px}
.pinbox:focus{outline:none;border-color:var(--caribe)}
.join .pinbox{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18);height:50px;font-size:22px;margin:0}
button:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="../"><img src="../images/logo-palm.png" alt=""><b>Azul Caribe</b></a>
    <div class="lang" role="group" aria-label="Idioma / Language"><button data-l="es" aria-pressed="true">ES</button><button data-l="en" aria-pressed="false">EN</button></div>
  </header>

  <p class="status" id="status" role="status" hidden></p>

  <!-- Primera vez: el cliente crea su tarjeta con nombre y celular -->
  <section class="card join" id="join" hidden>
    <h1 data-t="joinTitle"></h1>
    <p class="sub" data-t="joinSub"></p>
    <form id="joinForm" class="form" novalidate>
      <label><span data-t="nameLabel"></span><input id="jName" name="name" autocomplete="given-name" maxlength="80" required></label>
      <label><span data-t="phoneLabel"></span><input id="jPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="300 123 4567" maxlength="20" required></label>
      <label class="check"><input id="jConsent" type="checkbox"><span data-t="consent"></span></label>
      <p class="err" id="joinErr" role="alert"></p>
      <button class="btn btn-gold" type="submit" data-t="joinBtn"></button>
    </form>
    <button class="link" id="toRecover" type="button" data-t="haveCard"></button>
  </section>

  <!-- Ya tenía tarjeta en otro celular: el mesero confirma con su código -->
  <section class="card join" id="recover" hidden>
    <h1 data-t="recTitle"></h1>
    <p class="sub" data-t="recSub"></p>
    <form id="recForm" class="form" novalidate>
      <label><span data-t="phoneLabel"></span><input id="rPhone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="300 123 4567" maxlength="20" required></label>
      <label><span data-t="pinLabel"></span><input id="rPin" class="pinbox" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" required></label>
      <p class="err" id="recErr" role="alert"></p>
      <button class="btn btn-gold" type="submit" data-t="recBtn"></button>
    </form>
    <button class="link" id="toJoin" type="button" data-t="newCard"></button>
  </section>

  <div id="cardView" hidden>
    <div class="card">
      <p class="hello" id="hello"></p>
      <h1 data-t="title"></h1>
      <p class="sub" id="sub"></p>
      <div class="grid" id="grid" aria-live="polite"></div>
      <p class="progress" id="progress"></p>
      <button class="btn btn-gold" id="stampBtn" data-t="stampBtn"></button>
      <p class="note" id="note" aria-live="polite"></p>
    </div>

    <div class="win" id="win" hidden>
      <h2 id="winTitle"></h2>
      <p id="winText"></p>
      <button class="btn btn-blue" id="redeemBtn" data-t="redeemBtn"></button>
    </div>

    <section class="box">
      <h2 data-t="rewardsTitle"></h2>
      <ul class="rew" id="rew"></ul>
    </section>

    <section class="box">
      <h2 data-t="howTitle"></h2>
      <ul class="rules" id="rules"></ul>
    </section>
    <div class="foot"><button class="link dim" id="logout" type="button" data-t="notYou"></button></div>
  </div>

  <p class="legal">El exceso de alcohol es perjudicial para la salud. Prohíbase el expendio de bebidas embriagantes a menores de edad.</p>
  <div class="foot"><a href="../" data-t="menuLink"></a></div>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <input id="pin" class="pinbox" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" aria-labelledby="dlgTitle">
    <p class="err" id="err" role="alert"></p>
    <div class="row">
      <button class="btn btn-blue" id="okBtn" type="submit" value="ok" data-t="confirm"></button>
      <button class="btn btn-ghost" id="cancelBtn" type="button" data-t="cancel"></button>
    </div>
  </form>
</dialog>

<script>
// La tarjeta vive en el servidor de 3R: este celular solo guarda la llave de su tarjeta.
const API='https://threer-api-79ux.onrender.com/api/v1', SLUG='azul-caribe';
const TOKEN_KEY='acl-sellos-token';
// Textos de cada premio por idioma (el servidor guarda la etiqueta en español).
const REWARD_TEXT={
 es:{4:['20 % de descuento','En la cuenta de esa visita','el 20 % de descuento','¡Ganaste 20 % de descuento!'],
     7:['Café gratis','Americano, capuchino o latte','un café gratis','¡Ganaste un café gratis!'],
     10:['Cóctel gratis','El que quieras de la carta · solo mayores de 18','un cóctel gratis','¡Ganaste un cóctel gratis!']},
 en:{4:['20% off','On that visit\'s bill','20% off','You earned 20% off!'],
     7:['Free coffee','Americano, cappuccino or latte','a free coffee','You earned a free coffee!'],
     10:['Free cocktail','Any one on the menu · 18+ only','a free cocktail','You earned a free cocktail!']}
};
const LAB={es:{4:'20 %',7:'Café',10:'Cóctel'},en:{4:'20%',7:'Coffee',10:'Cocktail'}};
const T={
 es:{title:'Tu tarjeta de sellos',sub:(g,r)=>`${g} visitas, ${r} premios. Pide tu sello cada vez que vengas.`,stampBtn:'Pedir mi sello',hello:n=>`Hola, ${n}`,
  progress:(s,g,r)=>r?`Llevas <b>${s} de ${g}</b> sellos. Te faltan <b>${r.left}</b> para ${r.name}.`:`Llevas <b>${s} de ${g}</b> sellos. ¡Completaste la tarjeta!`,
  lock:'Bloqueado',ready:'¡Listo!',used:'Canjeado',
  winP:'Muéstrale esta pantalla al mesero. Él escribe su código para canjearlo.',redeemBtn:'Canjear ahora',
  rewardsTitle:'Premios',howTitle:'Cómo funciona',menuLink:'Ver la carta',notYou:'¿No es tu tarjeta? Salir',
  rules:h=>['Pide un sello cada vez que vengas y consumas. El mesero lo pone con su código.',h?`Máximo un sello cada ${h}.`:'',
   'Los premios se canjean en el local, mostrando esta pantalla.','Cada visita se marca con un sello. Cuando canjeas un premio, en su casilla aparece la palmera.',
   'Después del último premio, tu siguiente sello empieza una tarjeta nueva.','Tu tarjeta queda guardada con tu celular. Si cambias de teléfono, el mesero te la pasa al nuevo.'].filter(Boolean),
  joinTitle:'Crea tu tarjeta de sellos',joinSub:'Junta sellos en cada visita y gana premios. Solo la primera vez.',
  nameLabel:'Tu nombre',phoneLabel:'Tu celular',joinBtn:'Crear mi tarjeta',haveCard:'Ya tengo tarjeta en otro celular',
  consent:'Acepto que Azul Caribe Lounge guarde mi nombre y celular para manejar mi tarjeta de sellos y escribirme sobre premios y promociones. Puedo pedir que los borren cuando quiera.',
  recTitle:'Recupera tu tarjeta',recSub:'Escribe el celular con el que la creaste y pídele al mesero que confirme con su código.',
  pinLabel:'Código del mesero',recBtn:'Pasar mi tarjeta a este celular',newCard:'No tengo tarjeta: crear una nueva',
  needName:'Escribe tu nombre.',needPhone:'Escribe tu celular.',needConsent:'Para crear la tarjeta debes aceptar el uso de tus datos.',
  dlgStamp:'Código del mesero',dlgStampP:'Entrégale el celular al mesero para que ponga tu sello.',dlgRedeem:'Canjear premio',dlgRedeemP:'El mesero escribe su código para entregarte el premio.',
  confirm:'Confirmar',cancel:'Cancelar',needPin:'Escribe el código.',
  wait:h=>`Ya recibiste un sello hace poco. El siguiente, en tu próxima visita (en ${h}).`,full:'Canjea tu último premio para empezar una tarjeta nueva.',done:'¡Tarjeta completa! Con tu próximo sello empiezas una nueva.',
  stamped:w=>`¡Sello puesto! Gracias por venir.${w?' · '+w:''}`,redeemed:w=>`Premio canjeado. ¡Disfrútalo!${w?' · '+w:''}`,cards:n=>`Tarjetas completadas: ${n}`,
  loading:'Cargando tu tarjeta…',offline:'No pudimos conectarnos. Revisa tu internet y vuelve a intentar.',retry:'Reintentar',generic:'Algo salió mal. Intenta otra vez.'},
 en:{title:'Your stamp card',sub:(g,r)=>`${g} visits, ${r} rewards. Ask for a stamp every time you come.`,stampBtn:'Get my stamp',hello:n=>`Hi, ${n}`,
  progress:(s,g,r)=>r?`You have <b>${s} of ${g}</b> stamps. <b>${r.left}</b> more for ${r.name}.`:`You have <b>${s} of ${g}</b> stamps. Card complete!`,
  lock:'Locked',ready:'Ready!',used:'Redeemed',
  winP:'Show this screen to your server. They enter their code to redeem it.',redeemBtn:'Redeem now',
  rewardsTitle:'Rewards',howTitle:'How it works',menuLink:'See the menu',notYou:'Not your card? Sign out',
  rules:h=>['Ask for a stamp every time you visit and order. Your server adds it with their code.',h?`One stamp every ${h} at most.`:'',
   'Rewards are redeemed at the venue by showing this screen.','Each visit gets a check mark. When you redeem a reward, the palm appears in its box.',
   'After the last reward, your next stamp starts a new card.','Your card is saved with your phone number. If you change phones, your server moves it to the new one.'].filter(Boolean),
  joinTitle:'Create your stamp card',joinSub:'Collect stamps on every visit and earn rewards. Only the first time.',
  nameLabel:'Your name',phoneLabel:'Your mobile number',joinBtn:'Create my card',haveCard:'I already have a card on another phone',
  consent:'I agree that Azul Caribe Lounge may keep my name and mobile number to manage my stamp card and contact me about rewards and promotions. I can ask for them to be deleted at any time.',
  recTitle:'Recover your card',recSub:'Enter the number you signed up with and ask your server to confirm with their code.',
  pinLabel:'Server code',recBtn:'Move my card to this phone',newCard:'I don\'t have a card: create one',
  needName:'Enter your name.',needPhone:'Enter your mobile number.',needConsent:'To create the card you must accept the use of your data.',
  dlgStamp:'Server code',dlgStampP:'Hand your phone to your server so they can add your stamp.',dlgRedeem:'Redeem reward',dlgRedeemP:'Your server enters their code to give you the reward.',
  confirm:'Confirm',cancel:'Cancel',needPin:'Enter the code.',
  wait:h=>`You got a stamp recently. The next one on your next visit (in ${h}).`,full:'Redeem your last reward to start a new card.',done:'Card complete! Your next stamp starts a new one.',
  stamped:w=>`Stamp added! Thanks for coming.${w?' · '+w:''}`,redeemed:w=>`Reward redeemed. Enjoy!${w?' · '+w:''}`,cards:n=>`Completed cards: ${n}`,
  loading:'Loading your card…',offline:'We couldn\'t connect. Check your internet and try again.',retry:'Try again',generic:'Something went wrong. Try again.'}
};
// Mensajes del servidor por código, para mostrarlos también en inglés.
const SERVER_EN={BAD_PIN:'Wrong code. Try again.',TOO_SOON:'You got a stamp recently. The next one on your next visit.',CARD_FULL:'Redeem your last reward to start a new card.',
 NO_REWARD:'There is no reward to redeem yet.',PHONE_EXISTS:'That number already has a card. Ask your server to move it to this phone with their code.',NO_CARD:'There is no card with that number.'};

const $=id=>document.getElementById(id);
const store={get(){try{return localStorage.getItem(TOKEN_KEY)}catch(e){return null}},set(v){try{v?localStorage.setItem(TOKEN_KEY,v):localStorage.removeItem(TOKEN_KEY)}catch(e){}}};
let L='es';try{const a=localStorage.getItem('acl-sellos-lang')||localStorage.getItem('azulcaribe_lang');if(a)L=a==='es'?'es':'en';else if(!/^es/i.test(navigator.language))L='en'}catch(e){}
const t=()=>T[L];
const logo='../images/logo-palm.png';
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let program=null, card=null, view='loading', newIdx=null, lastNote='';

async function api(path,{method='GET',body,auth=true}={}){
  const headers={'content-type':'application/json'};const tok=store.get();
  if(auth&&tok)headers.authorization='Bearer '+tok;
  let res;
  try{res=await fetch(`${API}/loyalty/${SLUG}${path}`,{method,headers,body:body?JSON.stringify(body):undefined})}
  catch(e){const err=new Error(t().offline);err.offline=true;throw err}
  const data=await res.json().catch(()=>null);
  if(!res.ok){const err=new Error(errText(data));err.code=data&&data.code;err.status=res.status;throw err}
  return data;
}
function errText(data){
  if(!data)return t().generic;
  if(L==='en'&&data.code&&SERVER_EN[data.code])return SERVER_EN[data.code];
  if(L==='en'&&data.code==='LOCKED')return 'Too many tries. Wait a few minutes and try again.';
  const m=Array.isArray(data.message)?data.message[0]:data.message;
  return m||t().generic;
}
const rText=(at,i,fallback)=>((REWARD_TEXT[L]||{})[at]||[])[i]||fallback;
function fmtH(ms){const m=Math.ceil(ms/60000);if(m>=60){const h=Math.floor(m/60),r=m%60;return r?`${h} h ${r} min`:`${h} h`}return `${m} min`}
function cooldownText(min){if(!min)return '';return min%60?fmtH(min*60000):(min/60===1?(L==='es'?'1 hora':'1 hour'):`${min/60} ${L==='es'?'horas':'hours'}`)}

function show(v){view=v;['join','recover','cardView'].forEach(id=>$(id).hidden=id!==v);$('status').hidden=v!=='loading'&&v!=='offline';}

function render(){
  document.documentElement.lang=L;
  document.querySelectorAll('[data-t]').forEach(el=>{const v=t()[el.dataset.t];if(typeof v==='string')el.textContent=v});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===L)));
  if(view==='loading'){$('status').textContent=t().loading}
  if(view==='offline'){$('status').innerHTML=`${t().offline} <button class="link" id="retry" type="button">${t().retry}</button>`;$('retry').onclick=boot}
  if(view!=='cardView'||!card)return;
  const goal=card.program.goal, n=card.stamps, rw=card.rewards;
  $('hello').textContent=t().hello(card.name);
  $('sub').textContent=t().sub(goal,rw.length);
  const g=$('grid');g.innerHTML='';
  for(let i=1;i<=goal;i++){
    const m=rw.find(r=>r.at===i), on=i<=n, used=m&&m.status==='used', ready=m&&m.status==='ready';
    const s=document.createElement('div');s.className='slot';
    s.innerHTML=`<div class="dot${m?' milestone':''}${on?' on':''}${used?' prize':''}${ready?' ready':''}${newIdx===i?' new':''}">${used?`<img src="${logo}" alt="">`:on?CHECK:i}</div><span class="lab">${m?((LAB[L]||{})[i]||m.label):''}</span>`;
    s.setAttribute('aria-label',`${i}${on?' ✓':''}`);g.appendChild(s);
  }
  newIdx=null;
  const nx=card.next;
  $('progress').innerHTML=t().progress(n,goal,nx?{left:nx.at-n,name:rText(nx.at,2,nx.label)}:null)+(card.cardsCompleted?` <br><span style="font-size:13px;color:#c6d1de">${t().cards(card.cardsCompleted)}</span>`:'');
  const r=card.ready;
  $('win').hidden=!r;
  if(r){$('winTitle').textContent=rText(r.at,3,'¡Ganaste '+r.label+'!');$('winText').textContent=t().winP}
  const full=n>=goal&&!card.complete, left=card.nextStampAt?new Date(card.nextStampAt)-Date.now():0;
  $('stampBtn').disabled=full||left>0;
  $('note').textContent=lastNote||(card.complete?t().done:full?t().full:(left>0?t().wait(fmtH(left)):''));
  $('rew').innerHTML=rw.map(x=>`<li><span class="n">${x.at}</span><span class="t"><b>${rText(x.at,0,x.label)}</b><span>${rText(x.at,1,'')}</span></span><span class="tag ${x.status==='locked'?'':x.status}">${t()[x.status==='locked'?'lock':x.status]}</span></li>`).join('');
  $('rules').innerHTML=t().rules(cooldownText(card.program.cooldownMinutes)).map(x=>`<li>${x}</li>`).join('');
}

async function boot(){
  show('loading');render();
  try{
    if(store.get()){
      try{card=await api('/card');show('cardView');render();return}
      catch(e){if(e.status===401){store.set(null)}else throw e}
    }
    show('join');render();
  }catch(e){show('offline');render()}
}

$('toRecover').onclick=()=>{$('recErr').textContent='';show('recover');render();$('rPhone').focus()};
$('toJoin').onclick=()=>{$('joinErr').textContent='';show('join');render();$('jName').focus()};
$('logout').onclick=()=>{store.set(null);card=null;lastNote='';show('join');render()};

function busy(form,on){form.querySelectorAll('button,input').forEach(el=>el.disabled=on)}

$('joinForm').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.currentTarget;const err=$('joinErr');err.textContent='';
  const name=$('jName').value.trim(), phone=$('jPhone').value.trim();
  if(!name){err.textContent=t().needName;return}
  if(!phone){err.textContent=t().needPhone;return}
  if(!$('jConsent').checked){err.textContent=t().needConsent;return}
  busy(f,true);
  try{const r=await api('/customers',{method:'POST',auth:false,body:{name,phone,consent:true}});store.set(r.token);card=r.card;lastNote='';show('cardView');render()}
  catch(x){err.textContent=x.message;if(x.code==='PHONE_EXISTS'){$('rPhone').value=phone}}
  finally{busy(f,false)}
});

$('recForm').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.currentTarget;const err=$('recErr');err.textContent='';
  const phone=$('rPhone').value.trim(), pin=$('rPin').value.trim();
  if(!phone){err.textContent=t().needPhone;return}
  if(!pin){err.textContent=t().needPin;return}
  busy(f,true);
  try{const r=await api('/customers/recover',{method:'POST',auth:false,body:{phone,pin}});store.set(r.token);card=r.card;lastNote='';$('rPin').value='';show('cardView');render()}
  catch(x){err.textContent=x.message;$('rPin').value=''}
  finally{busy(f,false)}
});

let mode='stamp';
function openDlg(m){
  mode=m;$('dlgTitle').textContent=m==='stamp'?t().dlgStamp:t().dlgRedeem;$('dlgText').textContent=m==='stamp'?t().dlgStampP:t().dlgRedeemP;
  $('pin').value='';$('err').textContent='';$('dlg').showModal();setTimeout(()=>$('pin').focus(),50);
}
$('stampBtn').addEventListener('click',()=>openDlg('stamp'));
$('redeemBtn').addEventListener('click',()=>openDlg('redeem'));
$('cancelBtn').addEventListener('click',()=>$('dlg').close());
$('pin').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,8)});
$('dlgForm').addEventListener('submit',async e=>{
  e.preventDefault();const pin=$('pin').value;const f=e.currentTarget;
  if(pin.length<4){$('err').textContent=t().needPin;return}
  busy(f,true);
  try{
    const before=card.stamps;
    const r=await api(mode==='stamp'?'/card/stamp':'/card/redeem',{method:'POST',body:{pin}});
    card=r.card;$('dlg').close();
    if(mode==='stamp')newIdx=card.stamps>before||card.stamps===1?card.stamps:null;
    lastNote=mode==='stamp'?t().stamped(r.staff):t().redeemed(r.staff);render();lastNote='';
  }catch(x){
    $('err').textContent=x.message;$('pin').value='';$('pin').focus();
    if(x.status===401&&x.code==='NO_CARD'){$('dlg').close();store.set(null);show('join');render()}
    if(x.code==='TOO_SOON'||x.code==='CARD_FULL'||x.code==='NO_REWARD'){try{card=await api('/card');render()}catch(_){}}
  }finally{busy(f,false)}
});
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{L=b.dataset.l;try{localStorage.setItem('acl-sellos-lang',L)}catch(e){}render()}));
boot();
</script>
</body>
</html>
